<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>For My Happiness 💚</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">

  <!-- GSAP & Canvas-Confetti via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #faf0e6 100%);
      font-family: 'Comfortaa', cursive, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: #3e2723;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 932px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    canvas#bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden;
    }

    /* Top Controls */
    .top-controls {
      position: absolute;
      top: 25px;
      right: 20px;
      z-index: 30;
    }

    .reset-btn {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: #8b5a2b;
      font-family: inherit;
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    /* SCENE 1: BIG HEART */
    #heart-wrapper {
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .big-heart {
      width: 130px;
      height: 130px;
      color: #2ecc71;
      filter: drop-shadow(0 0 30px rgba(46, 204, 113, 0.6));
      transform-origin: center center;
    }

    /* SCENE 2: BOUQUET & ENVELOPE */
    .bouquet-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .bouquet-svg {
      width: 320px;
      height: 420px;
      filter: drop-shadow(0 15px 25px rgba(184, 134, 11, 0.15));
      margin-top: -30px;
    }

    /* Small envelope placed at bottom-right stem base */
    .mini-envelope {
      position: absolute;
      bottom: 18%;
      right: 12%;
      width: 82px;
      height: 56px;
      background: #fffdfa;
      border: 1.5px solid #d4af37;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(139, 90, 43, 0.25);
      cursor: pointer;
      z-index: 20;
      transform: rotate(12deg);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .mini-envelope:active {
      transform: rotate(12deg) scale(0.92);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 41px solid transparent;
      border-right: 41px solid transparent;
      border-top: 28px solid #f7f3e8;
    }

    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -35%);
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #2ecc71 0%, #27ae60 100%);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 11px;
    }

    /* SCENE 3: LETTER MODAL */
    #scene-letter {
      z-index: 40;
      justify-content: center;
    }

    .letter-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      border-radius: 28px;
      padding: 35px 26px;
      width: 90%;
      max-height: 75vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(139, 90, 43, 0.15);
      scrollbar-width: none;
    }

    .letter-card::-webkit-scrollbar {
      display: none;
    }

    .letter-text {
      font-size: 0.95rem;
      line-height: 1.85;
      color: #3e2723;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
    }

    .back-btn {
      position: fixed;
      bottom: 40px;
      right: 25px;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: #ffffff;
      font-weight: bold;
      font-family: inherit;
      border: none;
      padding: 12px 26px;
      border-radius: 30px;
      font-size: 0.9rem;
      box-shadow: 0 8px 20px rgba(46, 204, 113, 0.35);
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s;
    }

    .back-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <canvas id="bgCanvas"></canvas>

    <!-- Top Reset Button -->
    <div class="top-controls">
      <button class="reset-btn" onclick="resetApp()">↻ თავიდან</button>
    </div>

    <!-- SCENE 1: HEART ENTRANCE -->
    <div id="scene-intro" class="scene">
      <div id="heart-wrapper" onclick="explodeHeart()">
        <svg class="big-heart" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
    </div>

    <!-- SCENE 2: BOUQUET & MINI ENVELOPE -->
    <div id="scene-bouquet" class="scene hidden">
      <div class="bouquet-stage">
        
        <!-- Rose Bouquet SVG -->
        <svg class="bouquet-svg" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Stems & Foliage -->
          <path d="M180 340 L150 460" stroke="#2d5a27" stroke-width="7" stroke-linecap="round"/>
          <path d="M200 340 L200 470" stroke="#1e3f1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M220 340 L250 460" stroke="#2d5a27" stroke-width="7" stroke-linecap="round"/>
          
          <!-- Wrapper Base -->
          <path d="M130 310 Q200 350 270 310 L240 450 Q200 470 160 450 Z" fill="#fcf8f2" stroke="#d4af37" stroke-width="2"/>
          <path d="M120 280 Q200 330 280 280 L270 310 Q200 350 130 310 Z" fill="#f4ebd9" opacity="0.8"/>
          
          <!-- Golden Bow -->
          <path d="M170 380 Q200 395 230 380 Q250 410 240 430 Q200 400 160 430 Q150 410 170 380 Z" fill="#d4af37"/>
          <circle cx="200" cy="385" r="8" fill="#b8860b"/>

          <!-- Green Leaves -->
          <path d="M110 220 Q70 180 120 150 Q160 190 110 220 Z" fill="#3a6b35"/>
          <path d="M290 220 Q330 180 280 150 Q240 190 290 220 Z" fill="#3a6b35"/>
          <path d="M140 140 Q100 90 160 80 Q180 120 140 140 Z" fill="#487e43"/>
          <path d="M260 140 Q300 90 240 80 Q220 120 260 140 Z" fill="#487e43"/>

          <!-- Red & Pink Roses Layer -->
          <!-- Left Rose -->
          <g transform="translate(110, 160)">
            <circle cx="30" cy="30" r="28" fill="#e63946"/>
            <path d="M15 25 C20 10, 40 10, 45 25 C40 40, 20 40, 15 25" fill="#c1121f"/>
            <path d="M22 22 C25 15, 35 15, 38 22" fill="#780000"/>
          </g>

          <!-- Right Rose -->
          <g transform="translate(210, 160)">
            <circle cx="30" cy="30" r="28" fill="#ff4d6d"/>
            <path d="M15 25 C20 10, 40 10, 45 25 C40 40, 20 40, 15 25" fill="#c9184a"/>
            <path d="M22 22 C25 15, 35 15, 38 22" fill="#800f2f"/>
          </g>

          <!-- Top Center Rose -->
          <g transform="translate(160, 100)">
            <circle cx="40" cy="40" r="36" fill="#ff758f"/>
            <path d="M20 35 C28 15, 52 15, 60 35 C52 55, 28 55, 20 35" fill="#e63946"/>
            <path d="M30 32 C35 20, 45 20, 50 32" fill="#b7094c"/>
          </g>

          <!-- Center Main Rose -->
          <g transform="translate(155, 180)">
            <circle cx="45" cy="45" r="40" fill="#d90429"/>
            <path d="M22 40 C30 18, 60 18, 68 40 C60 62, 30 62, 22 40" fill="#ef233c"/>
            <path d="M32 37 C37 25, 53 25, 58 37" fill="#6a040f"/>
          </g>

          <!-- Baby Breath Flowers -->
          <circle cx="100" cy="130" r="5" fill="#ffffff"/><circle cx="112" cy="122" r="4" fill="#ffffff"/>
          <circle cx="290" cy="130" r="5" fill="#ffffff"/><circle cx="280" cy="122" r="4" fill="#ffffff"/>
          <circle cx="200" cy="80" r="6" fill="#ffffff"/><circle cx="215" cy="75" r="4" fill="#ffffff"/>
        </svg>

        <!-- Small Envelope placed near bottom right -->
        <div class="mini-envelope" id="miniEnvelope" onclick="openLetter()">
          <div class="envelope-flap"></div>
          <div class="wax-seal">💚</div>
        </div>

      </div>
    </div>

    <!-- SCENE 3: LETTER MODAL -->
    <div id="scene-letter" class="scene hidden">
      <div class="letter-card">
        <div class="letter-text" id="letterContent"></div>
      </div>
      <button class="back-btn" onclick="closeLetter()">უკან ↩</button>
    </div>

  </div>

  <script>
    const letterText = `დილამშვიდობისაა, ჩემო ჩემო ჩემო ბედნიერებაავ, ჩემო სიხარულოო, ძაან დიდი მადლობა რომ მყავხარ. უზომოთ გამიმართლა შენში, არ ვიცი რა მეშველებოდა შენ რომ არა, მთელი ჩემი სამყარო ხარ. მთელი ჩემი ცხოვრების არსი ხარ. მინდა ყოველი წამი შენ მოგიძღვნა შენთან ერთად ვგანვლო ეს ცხოვრება. მინდა ერთმანეთს ტკბილად შევაბერდეთ.  ჩვენი ულამაზესი ოჯახი შევქმნათ, მიყვარხარ ძაან ძაან ძაან ,გყვარობ მთელი არსებით.`;

    /* Audio Feedback */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq = 520, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    /* Canvas Heart Rain System */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class HeartParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = -20;
        this.size = Math.random() * 12 + 8;
        this.speedY = Math.random() * 1.8 + 1.2;
        this.opacity = Math.random() * 0.6 + 0.3;
        this.color = Math.random() > 0.4 ? '#2ecc71' : '#ff758f';
        this.swing = Math.random() * 0.04;
        this.swingAngle = Math.random() * Math.PI * 2;
      }

      update() {
        this.y += this.speedY;
        this.swingAngle += this.swing;
        this.x += Math.sin(this.swingAngle) * 0.7;
        if (this.y > height + 20) this.reset();
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        const topCurveHeight = this.size * 0.3;
        ctx.moveTo(this.x, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
        ctx.bezierCurveTo(this.x, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + topCurveHeight, this.x + this.size / 2, this.y + topCurveHeight);
        ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topCurveHeight);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    const particles = Array.from({ length: 35 }, () => new HeartParticle());

    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    /* GSAP Pulse Animation */
    const heartPulseTL = gsap.timeline({ repeat: -1, yoyo: true });
    heartPulseTL.to('.big-heart', {
      scale: 1.25,
      duration: 0.8,
      ease: 'power1.inOut'
    });

    /* Explode Heart & Switch to Bouquet */
    function explodeHeart() {
      playTone(600, 'sine', 0.25);

      confetti({
        shapes: ['square'],
        colors: ['#2ecc71', '#ff758f', '#d4af37', '#ffffff'],
        particleCount: 80,
        spread: 100,
        origin: { y: 0.5 }
      });

      gsap.to('#scene-intro', {
        scale: 0,
        opacity: 0,
        duration: 0.5,
        onComplete: () => {
          document.getElementById('scene-intro').classList.add('hidden');
          showBouquetScene();
        }
      });
    }

    function showBouquetScene() {
      const bouquetScene = document.getElementById('scene-bouquet');
      bouquetScene.classList.remove('hidden');

      gsap.fromTo('.bouquet-svg', 
        { scale: 0.5, opacity: 0, y: 50 },
        { scale: 1, opacity: 1, y: 0, duration: 1.2, ease: 'elastic.out(1, 0.75)' }
      );

      gsap.fromTo('#miniEnvelope',
        { scale: 0, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.8, delay: 0.5, ease: 'back.out(1.7)' }
      );
    }

    /* Open / Close Letter */
    function openLetter() {
      playTone(650, 'sine', 0.2);

      const letterScene = document.getElementById('scene-letter');
      document.getElementById('letterContent').textContent = letterText;
      
      letterScene.classList.remove('hidden');

      gsap.fromTo(letterScene,
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out' }
      );
    }

    function closeLetter() {
      playTone(450, 'sine', 0.2);

      const letterScene = document.getElementById('scene-letter');
      gsap.to(letterScene, {
        opacity: 0,
        scale: 0.85,
        duration: 0.3,
        onComplete: () => {
          letterScene.classList.add('hidden');
        }
      });
    }

    /* Reset Application */
    function resetApp() {
      playTone(400, 'sine', 0.15);
      document.getElementById('scene-letter').classList.add('hidden');
      document.getElementById('scene-bouquet').classList.add('hidden');
      
      const intro = document.getElementById('scene-intro');
      intro.classList.remove('hidden');
      gsap.to(intro, { scale: 1, opacity: 1, duration: 0.4 });
    }
  </script>
</body>
</html>
